# No Java: a vehicle for Vanilla Wheels is a datapack entry, a mesh and a texture.
modLoader="lowcodefml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/the-rusty-shackleford/minecraft-trailer/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Rusty Shackleford, nfx"
description='''
The Trailer: a livestock trailer for Vanilla Wheels. Hitches behind any
vehicle with a rear hitch, carries four grown animals or eight young
behind double doors, and follows like a real trailer: the axle dragged
along the line to the hitch.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The protocol, nested in this jar.
[[dependencies.${mod_id}]]
    modId="vanillawheels"
    type="required"
    versionRange="[1.2.1,2.0)"
    ordering="AFTER"
    side="BOTH"
